name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Cloudflare runtime types
        run: npm run cf-typegen
      - run: npm run typecheck
      - run: npm test
      - name: Dry-run deploy (validates wrangler.jsonc + bundling, does not publish)
        run: npx wrangler deploy --dry-run
